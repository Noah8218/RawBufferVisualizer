name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\RawBufferVisualizer.sln

      - name: Build
        run: dotnet build .\RawBufferVisualizer.sln --configuration Release --no-restore

      - name: Self-test
        run: dotnet run --project .\tests\RawBufferVisualizer.Tests\RawBufferVisualizer.Tests.csproj --configuration Release --framework net8.0-windows

      - name: Classic handoff contracts
        timeout-minutes: 5
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -version '[17.9,18.0)' -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsRoot)) { throw 'The Classic contract check requires installed VS2022 17.9+.' }
          pwsh -NoProfile -File .\scripts\Test-HeadlessSnapshotVisualizer.ps1 -VisualStudioRoot ($vsRoot.Trim()) -OutputRoot (Join-Path $env:RUNNER_TEMP 'rawbuffer-classic-contract')

      - name: Publish package
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Publish-Windows.ps1

      - name: Publish Visual Studio extension prototype
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Publish-VisualStudioExtension.ps1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: artifacts\publish\RawBufferVisualizer-net8.0-windows-win-x64-sc.zip
          if-no-files-found: error
          archive: false

      - name: Upload Visual Studio extension prototype
        uses: actions/upload-artifact@v7
        with:
          path: artifacts\publish\RawBufferVisualizer-VisualStudioExtensibility-net472.zip
          if-no-files-found: error
          archive: false
