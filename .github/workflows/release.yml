name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Validate release communication
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Test-ReleaseCommunication.ps1 -ExpectedVersion $env:GITHUB_REF_NAME

      - name: Restore
        run: dotnet restore .\RawBufferVisualizer.sln

      - name: Build
        run: dotnet build .\RawBufferVisualizer.sln --configuration Release --no-restore

      - name: Self-test
        run: dotnet run --project .\tests\RawBufferVisualizer.Tests\RawBufferVisualizer.Tests.csproj --configuration Release --framework net8.0-windows

      - name: Publish package
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Publish-Windows.ps1

      - name: Publish Visual Studio extension prototype
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Publish-VisualStudioExtension.ps1

      - name: Create GitHub Release
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          $notesPath = ".\docs\marketplace-release-notes-$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Curated release notes were not found: $notesPath"
          }

          gh release create $env:GITHUB_REF_NAME `
            .\artifacts\publish\RawBufferVisualizer-net8.0-windows-win-x64-sc.zip `
            --verify-tag `
            --notes-file $notesPath `
            --title "Raw Buffer Visualizer $version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
